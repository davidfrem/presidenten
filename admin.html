<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presidenten beheer</title><link rel="stylesheet" href="/admin.css"></head>
<body><header><h1>Presidenten beheer</h1><button id="logout" hidden>Uitloggen</button></header>
<p id="status" role="status">Login laden...</p><div id="login"></div>
<main id="report" hidden><section><h2>Nu actief <span id="count"></span></h2><div id="active"></div></section>
<section><h2>Sessiehistorie</h2><form id="filters"><label>Van <input id="from" type="date" required></label>
<label>Tot en met <input id="to" type="date" required></label><label>Naam <input id="name" type="search"></label>
<button>Vernieuwen</button></form><p id="daily"></p><p id="total"></p><div class="table-wrap"><table><thead><tr><th>Naam</th><th>Modus</th><th>Kamer</th><th>Rondes voltooid</th><th>Rondes gestart</th><th>Start</th><th>Laatst gezien</th><th>Einde</th></tr></thead><tbody id="history"></tbody></table></div>
<button id="more" hidden>Meer laden</button></section></main>
<script src="https://accounts.google.com/gsi/client" async defer></script><script type="module" src="/admin.js"></script></body></html>

<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d6a35">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Presidenten">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Presidenten</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="table-shell">
      <section class="game-table" aria-label="Presidenten speeltafel">
        <div class="topbar">
          <div>
            <h1>Presidenten</h1>
            <p id="roundLabel">Ronde 1</p>
          </div>
          <div class="topbar-actions">
            <button id="settingsButton" class="ghost-button" type="button">Instellingen</button>
            <button id="newGameButton" class="ghost-button" type="button">Nieuw spel</button>
          </div>
        </div>

        <div class="players-grid">
          <article class="opponent opponent-left" id="player-3"></article>
          <article class="opponent opponent-top" id="player-2"></article>
          <article class="opponent opponent-right" id="player-1"></article>
        </div>

        <section class="human-area" id="player-0">
          <div class="hand-header">
            <div class="human-pill">
              <span class="player-avatar human-avatar">👤</span>
              <h2 id="humanName">Jij</h2>
              <p id="humanRole">Burger</p>
              <span id="humanFinishBadge" class="finish-badge"></span>
              <span id="humanPassBadge" class="pass-badge">Pas</span>
            </div>
            <div id="turnHint" class="turn-hint"></div>
          </div>
          <div class="personal-pile-wrap">
            <div id="humanPlayedPile" class="played-pile played-pile-human"></div>
          </div>
          <div id="hand" class="hand" aria-label="Je hand"></div>
        </section>

        <div class="controls">
          <button id="playButton" class="primary-button" type="button" disabled>Speel</button>
          <button id="passButton" class="secondary-button" type="button" disabled>Pas</button>
        </div>

        <aside class="activity-panel" aria-live="polite">
          <div class="pile-title">Verloop</div>
          <ol id="activityLog"></ol>
        </aside>

        <dialog id="exchangeDialog" class="exchange-dialog">
          <form method="dialog">
            <h2 id="exchangeTitle">Kaarten teruggeven</h2>
            <p id="exchangeText"></p>
            <div id="exchangeHand" class="hand exchange-hand"></div>
            <menu>
              <button id="exchangeConfirm" class="primary-button" value="confirm" disabled>Bevestig</button>
            </menu>
          </form>
        </dialog>

        <dialog id="roundDialog" class="round-dialog">
          <form method="dialog">
            <h2 id="roundTitle">Ronde klaar</h2>
            <div id="resultsList" class="results-list"></div>
            <menu>
              <button id="continueButton" class="primary-button" value="continue">Volgende ronde</button>
            </menu>
          </form>
        </dialog>
      </section>
    </main>
    <div id="settingsDialog" class="settings-overlay" hidden>
      <form id="settingsForm" class="settings-dialog">
        <h2>Instellingen</h2>
        <div class="settings-section">
          <label for="playerNameInput">Jouw naam</label>
          <input id="playerNameInput" name="playerName" type="text" inputmode="text" enterkeyhint="done" maxlength="18" autocomplete="name" autocapitalize="words" autocorrect="off" spellcheck="false" placeholder="Jij">
          <div id="nameKeyboard" class="name-keyboard" aria-label="Naam invoeren"></div>
        </div>
        <div class="settings-section">
          <label for="botSkillSelect">Botniveau</label>
          <select id="botSkillSelect" name="botSkill">
            <option value="normal">Normaal</option>
          </select>
        </div>
        <menu>
          <button class="secondary-button" type="button" id="settingsCancel">Annuleer</button>
          <button class="primary-button" type="submit">Opslaan</button>
        </menu>
      </form>
    </div>
    <script type="module" src="game.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("service-worker.js");
        });
      }
    </script>
  </body>
</html>
